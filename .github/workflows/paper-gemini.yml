# The owner's paper: run the Gemini writer (writers/gemini/) on the same
# snapshot the Claude routine wrote from, and build the blind comparison
# packet (tools/compare/) for a later review. Nothing here publishes or emails:
# the writer pushes only gemini/, and the packet goes only to the paper's
# reviews/packets/ (never to a workflow artifact or this public log). A failed
# run blocks nothing; the publish job and the email are separate workflows.
#
# Started by the Worker's cron once per issue (worker/jobs.js): Wed + Sat at
# 16:45 UTC if the Claude routine's edition for the day is in, else at the
# 17:30 UTC backstop. Or by hand, with a date and kind for an older snapshot.
# docs/writers.md, "Running Gemini on a schedule", has the details.
name: "Paper: Gemini writer"

on:
  workflow_dispatch:
    inputs:
      date:
        description: "The issue's date, YYYY-MM-DD (default: today, UTC)"
        type: string
        default: ""
      kind:
        description: "weekly or update (auto: weekly on Saturdays, else update)"
        type: choice
        options: [auto, weekly, update]
        default: auto
      dry_run:
        description: "Dry run: count the requests and estimate tokens, send nothing to Gemini, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-gemini
  cancel-in-progress: false

env:
  PR_POST_API: ${{ secrets.PR_POST_API }}
  PR_POST_TOKEN: ${{ secrets.JOBS_TOKEN }}

jobs:
  write:
    if: github.repository == 'n8watkins/pr-post'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/paper
      - name: Which issue
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          date="${INPUT_DATE:-$(date -u +%F)}"
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$date" +%F >/dev/null 2>&1; then
            echo "::error::Not a date: use YYYY-MM-DD."
            exit 1
          fi
          kind="$INPUT_KIND"
          if [ -z "$kind" ] || [ "$kind" = auto ]; then
            if [ "$(date -u -d "$date" +%u)" = 6 ]; then kind=weekly; else kind=update; fi
          fi
          echo "ISSUE_DATE=$date" >> "$GITHUB_ENV"
          echo "ISSUE_KIND=$kind" >> "$GITHUB_ENV"
          echo "Issue: $date-$kind."
      - name: Pull the paper
        run: python3 scripts/store.py pull "$WORK"
      - name: Write with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        # The writer paces itself at its default 10 requests a minute (the
        # free tier's limit is higher) and pushes gemini/ when it is done.
        run: |
          paper/bin/quiet python3 -m writers.gemini run --paper "$WORK" --date "$ISSUE_DATE" --kind "$ISSUE_KIND" ${DRY_RUN:+--dry-run}
          if [ -n "$DRY_RUN" ]; then grep -E '^(Weekly|Update) run for |^Dry run: ' "$PAPER_LOG" || true; fi
      - name: Counts
        if: ${{ !cancelled() && !inputs.dry_run }}
        # Numbers only from the usage file: never people, paths or text.
        run: |
          python3 - "$WORK/gemini/usage/$ISSUE_DATE.json" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          try:
              u = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              sys.exit(print("No usage file: the writer did not finish."))
          p = u["people"]
          print(f"People: {p['active']} active, {p['quiet']} quiet, {p['skipped']} skipped.")
          print(f"Requests: {u['requests']} ({u['retries']} retries, {u['transport_retries']} transport retries).")
          print(f"Tokens: {u['input_tokens']} input, {u['output_tokens']} output, {u['thinking_tokens']} thinking.")
          print(f"Answers still failing a check: {len(u['checks_failing'])}; unusable: {len(u['failed'])}.")
          EOF
      - name: Build the blind packet
        if: ${{ success() && !inputs.dry_run }}
        # The packet and its key go to reviews/packets/ in the paper, laid out
        # like tools/compare's local .compare/ folder, so a review job can put
        # them back there. They are never uploaded as an artifact or printed.
        run: |
          if [ ! -f "$WORK/editions/$ISSUE_DATE-$ISSUE_KIND.json" ]; then
            echo "No Claude edition for $ISSUE_DATE-$ISSUE_KIND, so no packet to compare."
            exit 0
          fi
          paper/bin/quiet python3 -m tools.compare packet --paper "$WORK" --date "$ISSUE_DATE" --kind "$ISSUE_KIND"
          python3 scripts/store.py put "$WORK/.compare/$ISSUE_DATE/packet.md" "reviews/packets/$ISSUE_DATE/packet.md"
          python3 scripts/store.py put "$WORK/.compare/$ISSUE_DATE.key.json" "reviews/packets/$ISSUE_DATE.key.json"
      # TODO(review): the reviewers are being built in tools/compare. Once
      # `review` and `score` exist, add a step here (same condition as the
      # packet step, each command through paper/bin/quiet, results stored
      # only under reviews/ in the paper):
      #   python3 -m tools.compare review --paper "$WORK" --date "$ISSUE_DATE" --reviewer gemini
      #   python3 -m tools.compare score --paper "$WORK" --date "$ISSUE_DATE"
      - name: Store the log
        if: always()
        run: python3 scripts/store.py put "$PAPER_LOG" "logs/$GITHUB_RUN_ID-gemini.log"

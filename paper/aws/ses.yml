# Amazon SES for a pr-post paper, in one stack (docs/email.md).
#
# Creates: the sender domain identity with Easy DKIM and a custom MAIL FROM
# domain, your own address as a verified identity (so test sends work while the
# account is still in the SES sandbox), a configuration set that keeps the
# account-level suppression list and reports bounces, complaints, rejects,
# deliveries and delays to an SNS topic that posts them to the Worker, and a
# send-only IAM role that GitHub Actions assumes through OIDC. No access keys
# are created anywhere.
#
# Deploy it in the region you send from (the paper uses us-east-1):
# CloudFormation, Create stack, Upload a template file. The Outputs tab then
# lists the role ARN, the topic ARN and the DNS records to add; none are secret.
AWSTemplateFormatVersion: "2010-09-09"
Description: pr-post email through Amazon SES (send-only role for GitHub Actions, bounce and complaint events to the Worker)

Parameters:
  SenderDomain:
    Type: String
    Default: post.n8builds.dev
    Description: The domain the paper sends from. Its DNS records are listed in Outputs.
  FromAddress:
    Type: String
    Default: paper@post.n8builds.dev
    Description: The one From address the role may send as. Must be on SenderDomain.
  OwnerEmail:
    Type: String
    Description: Your own address. SES emails you a verification link; click it so test sends work in the sandbox.
  GitHubRepo:
    Type: String
    Default: n8watkins/pr-post
    Description: owner/repo whose Actions may send.
  GitHubEnvironment:
    Type: String
    Default: email
    Description: The GitHub environment the sending jobs run in (limited to the main branch there).
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: '"false" if IAM, Identity providers already lists token.actions.githubusercontent.com.'
  EventsEndpoint:
    Type: String
    AllowedPattern: "^https://.+/api/ses/events$"
    Description: Where SNS posts bounce and complaint events, https://<the paper's Worker>/api/ses/events (the Worker checks every signature).

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  ConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: pr-post
      DeliveryOptions:
        TlsPolicy: REQUIRE
      ReputationOptions:
        ReputationMetricsEnabled: true
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]
      SendingOptions:
        SendingEnabled: true

  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderDomain
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Sub bounce.${SenderDomain}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigSet
      FeedbackAttributes:
        EmailForwardingEnabled: false

  OwnerIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref OwnerEmail

  EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: pr-post-ses-events
      SignatureVersion: "2"

  EventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref EventsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesPublishesEvents
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref EventsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigSet}

  EventsDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: EventsTopicPolicy
    Properties:
      ConfigurationSetName: !Ref ConfigSet
      EventDestination:
        Name: worker
        Enabled: true
        MatchingEventTypes: [BOUNCE, COMPLAINT, REJECT, DELIVERY, DELIVERY_DELAY]
        SnsDestination:
          TopicARN: !Ref EventsTopic

  EventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventsTopic
      Protocol: https
      Endpoint: !Ref EventsEndpoint

  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  SenderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pr-post-ses-sender
      Description: Lets pr-post's email jobs send as one address through SES, nothing else.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidc
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: send-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderDomain}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${OwnerEmail}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigSet}
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref FromAddress

Outputs:
  RoleArn:
    Description: Set as the repository variable AWS_SES_ROLE_ARN.
    Value: !GetAtt SenderRole.Arn
  TopicArn:
    Description: Set as the Worker variable SES_TOPIC_ARN.
    Value: !Ref EventsTopic
  Dkim1:
    Description: CNAME record (DNS only)
    Value: !Sub "${SenderIdentity.DkimDNSTokenName1} CNAME ${SenderIdentity.DkimDNSTokenValue1}"
  Dkim2:
    Description: CNAME record (DNS only)
    Value: !Sub "${SenderIdentity.DkimDNSTokenName2} CNAME ${SenderIdentity.DkimDNSTokenValue2}"
  Dkim3:
    Description: CNAME record (DNS only)
    Value: !Sub "${SenderIdentity.DkimDNSTokenName3} CNAME ${SenderIdentity.DkimDNSTokenValue3}"
  MailFromMx:
    Description: MX record for the MAIL FROM domain
    Value: !Sub "bounce.${SenderDomain} MX 10 feedback-smtp.${AWS::Region}.amazonses.com"
  MailFromSpf:
    Description: TXT record for the MAIL FROM domain
    Value: !Sub 'bounce.${SenderDomain} TXT "v=spf1 include:amazonses.com ~all"'
